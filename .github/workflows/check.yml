name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo lectura: nada en este flujo escribe en el repositorio.
permissions:
  contents: read

# Si llegan varios cambios seguidos a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    # Fijado a propósito: ubuntu-latest pasa de 24.04 a 26.04 entre el 19-10-2026 y el 19-11-2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Sin `version`: toma la de `packageManager` (pnpm@12.14.0) del package.json raíz.
      - name: pnpm
        uses: pnpm/action-setup@v6

      # Debe ir DESPUÉS de instalar pnpm: `cache: pnpm` ejecuta `pnpm store path`.
      - name: Node 26 y caché del store de pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      # PostgreSQL 18 real con los roles owner/app y la base de pruebas (infra/postgres/init/01-roles.sh),
      # exactamente igual que en el PC: mismo compose.yaml. El runner trae Docker 28 y Compose 2.38;
      # --wait espera al healthcheck (pg_isready por TCP). Sin .env, compose y las pruebas usan .env.example.
      - name: Base de datos (docker compose)
        run: docker compose up -d --wait --wait-timeout 120 db

      # Comprueba el comando real de migraciones como owner; las pruebas migran aparte la base de pruebas.
      - name: Migraciones (pnpm db:migrate)
        run: pnpm db:migrate

      # La versión exacta de @playwright/test instalada (1.64.1): es la clave de la caché de navegadores.
      - name: Versión de Playwright
        id: playwright
        run: |
          echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Playwright guarda los navegadores en ~/.cache/ms-playwright (Linux). La clave cambia con cada
      # versión de Playwright, así que nunca se restaura un Chromium de otra versión.
      - name: Caché de navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Sin caché: Chromium + dependencias del sistema de Ubuntu. @playwright/test vive en apps/web, por eso el --filter.
      - name: Navegador de Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @los-papis/web exec playwright install --with-deps chromium

      # Con caché: los paquetes apt no se cachean, así que las dependencias del sistema se instalan igualmente.
      - name: Dependencias del sistema de Playwright
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @los-papis/web exec playwright install-deps chromium

      # Biome, tipos, drizzle-kit check, Vitest (web, api, shared, db contra PostgreSQL) y Playwright, en ese
      # orden; para al primer fallo.
      - name: pnpm check
        run: pnpm check

      - name: Informe de Playwright (solo si algo falla)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Registros de la base de datos (solo si algo falla)
        if: failure()
        run: docker compose logs db

  # Las dos imágenes de Docker y el arranque completo (db -> migrate -> api -> web), igual que en el PC y en el
  # servidor de pruebas. En paralelo con `check`: no comparten nada.
  docker:
    name: docker compose
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Sin .env: compose usa .env.example (avisos push desactivados). --wait espera a los healthchecks de
      # db/api/web y a que migrate termine con 0.
      - name: Construir y arrancar todo
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: La API responde a través de Caddy
        run: curl -fsS http://localhost:8080/api/health

      - name: Avisos push desactivados sin claves VAPID
        run: curl -fsS http://localhost:8080/api/push/config | grep -F '"enabled":false'

      - name: Manifiesto de la PWA
        run: curl -fsSI http://localhost:8080/manifest.webmanifest

      - name: Migraciones aplicadas por el servicio migrate
        run: docker compose logs migrate | grep -F 'Migraciones al día'

      # La capa del servidor con valores ficticios: sintaxis, !reset/!override y las ${VAR:?} obligatorias.
      - name: Capa del servidor (compose.server.yaml)
        env:
          IMAGE_TAG: ci
          POSTGRES_PASSWORD: x
          DB_OWNER_PASSWORD: x
          DB_APP_PASSWORD: x
          PUBLIC_URL: https://example.test
          VAPID_PUBLIC_KEY: x
          VAPID_PRIVATE_KEY: x
        run: docker compose -f compose.yaml -f compose.server.yaml config --quiet

      - name: Estado y registros (solo si algo falla)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs
