<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>LOS PAPIS</title>
    <!-- PWA: instalable en Android (manifiesto) y en iOS (metas apple-*); los iconos salen de scripts/make-icons.ts -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#111216" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LOS PAPIS" />
    <script>
      // Aplica .dark antes del primer pintado para evitar el parpadeo (misma clave que ThemeProvider).
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem('los-papis-theme');
        } catch {
          // Sin localStorage (modo privado): se sigue al sistema.
        }
        const theme = stored === 'light' || stored === 'dark' ? stored : 'system';
        const dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
