# Compose de LOS PAPIS (nombre canónico: compose.yaml; "version:" ya no se usa).
# Todo:                 docker compose up --build   ->  http://localhost:8080 (construye las imágenes :local)
# Solo la base de datos: docker compose up -d --wait db   (= pnpm db:up)
# Servidor de pruebas:   docker compose -f compose.yaml -f compose.server.yaml up -d --wait, con las imágenes
#                        ya cargadas desde el PC (IMAGE_TAG en .env) y sin construir nada: ver compose.server.yaml.
# Los servicios hablan por la red interna que Compose crea para el proyecto (los-papis_default):
# "web" publica 8080 al PC y "db" publica 5432 solo en 127.0.0.1 (para pnpm dev, migraciones y pruebas).
# Orden de arranque: db (healthy) -> migrate (termina con 0) -> api (healthy) -> web.
name: los-papis

services:
  db:
    image: postgres:18
    # POSTGRES_* los lee la imagen; DB_*_PASSWORD y POSTGRES_TEST_DB los lee infra/postgres/init/01-roles.sh.
    # .env.example aporta los valores de desarrollo y .env (si existe) los sustituye. Si cambias contraseñas
    # con el volumen ya creado: docker compose down -v (borra los datos locales) y vuelve a arrancar.
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    # TZ solo afecta al initdb inicial: la zona del servidor se fija aquí (los roles además tienen SET timezone).
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18: el volumen de la imagen es /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker).
      # Montar en /var/lib/postgresql/data, como en versiones anteriores, hace abortar el arranque.
      - db_data:/var/lib/postgresql
      # Scripts que corren UNA vez al crear el volumen: roles owner/app y la base de pruebas.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    # La imagen para con SIGINT (apagado rápido) y recomienda más de los 10 s por defecto.
    stop_grace_period: 30s
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: el servidor temporal de la inicialización arranca con listen_addresses=''
      # y así no cuenta como "listo" mientras corren los scripts de init. $$ es un $ literal para Compose.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 1s

  # De un solo uso: aplica las migraciones de packages/db/drizzle como owner y termina (Exited 0); cada
  # `docker compose up` lo vuelve a ejecutar (es idempotente). Misma imagen que la API, sin build: compose
  # construye `api` antes de crear los contenedores. Lee DB_OWNER_PASSWORD y POSTGRES_DB del env_file.
  migrate:
    image: los-papis-api:${IMAGE_TAG:-local}
    command: ["node", "migrate.mjs"]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    init: true

  api:
    image: los-papis-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        APP_VERSION: 0.1.0
    # .env.example deja VAPID_* vacías (avisos push desactivados) y aporta DB_APP_PASSWORD, AUTH_SECRET,
    # AUTH_ENCRYPTION_KEY y APP_SHOP_SLUG de desarrollo; .env, si existe, los sustituye.
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: info
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # La base, por la red interna: la DATABASE_URL del env_file apunta al 127.0.0.1 del PC (pnpm dev y
      # pruebas), así que se vacía y la API construye la suya con DB_HOST + DB_APP_PASSWORD + POSTGRES_DB.
      DATABASE_URL: ""
      DB_HOST: db
    depends_on:
      # Arranca cuando las migraciones han terminado bien (y migrate ya esperó a que db estuviera healthy).
      migrate:
        condition: service_completed_successfully
    # Node no está pensado para ser PID 1: un init reenvía señales y recoge zombis
    init: true
    restart: unless-stopped
    healthcheck:
      # node:26-slim no trae curl ni wget: se usa el fetch global de Node
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    image: los-papis-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      # http://localhost:8080 (y desde el iPad: http://IP-del-PC:8080). 80 y 443 no se usan en local.
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # caddy:2-alpine trae curl en /usr/bin/curl (comprobado en la imagen 2.11.7)
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  db_data:
  caddy_data:
  caddy_config:
